{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | AI Autism</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            margin: 0;
        }

        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #1e293b, #0f172a);
            color: white;
            padding-top: 20px;
        }

        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 5px 10px;
        }

        .sidebar a:hover {
            background-color: #334155;
            color: white;
        }

        .navbar-custom {
            background: white;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.05);
        }

        .content {
            padding: 30px;
        }

        .card-premium {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row min-vh-100">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <h4 class="text-center mb-4">AI Autism</h4>

            <a href="{% url 'admin_dashboard' %}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="{% url 'doctor_list' %}"><i class="bi bi-person-badge"></i> Doctors</a>
            <a href="{% url 'user_list' %}"><i class="bi bi-people"></i> Users</a>
            <a href="{% url 'detection_list' %}"><i class="bi bi-activity"></i> Detections</a>
            <a href="{% url 'user_answers_list' %}"><i class="bi bi-check2-square"></i> User Answers</a>
            <a href="{% url 'question_list' %}"><i class="bi bi-question-circle"></i> Questions</a>
            <a href="{% url 'doctor_slots' %}">
            <i class="bi bi-clock-history"></i> Doctor Slots</a>
            <a href="{% url 'admin_appointments' %}"><i class="bi bi-calendar-check"></i> Appointments</a>
            <a href="{% url 'admin_voice' %}"><i class="bi bi-mic"></i> Audio Analysis</a>
            <a href="#"><i class="bi bi-gear"></i> Settings</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 d-flex flex-column">

            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg navbar-light navbar-custom px-4">
                <div class="container-fluid">
                    <span class="navbar-brand fw-bold">Admin Dashboard</span>

                    <div class="d-flex align-items-center">
                        <span class="me-3">Welcome, {{ request.user.username }}</span>

                        <a href="{% url 'admin_logout' %}" class="btn btn-danger btn-sm me-3">
                            Logout
                        </a>

                        <img src="https://i.pravatar.cc/40" class="rounded-circle">
                    </div>
                </div>
            </nav>

            <!-- Content -->
            <div class="content flex-grow-1">
                {% block content %}{% endblock %}
            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
